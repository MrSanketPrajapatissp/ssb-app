# values-staging.yaml — Staging environment overrides.
# Mirrors production topology; autoscaling enabled; PDB active.
# Registry: ECR or local registry depending on deployment target.

replicaCount: 2

image:
  # In a real staging environment, this points to ECR or Docker Hub.
  # For local kind demo, use localhost:5001.
  repository: localhost:5001/ssb-app
  pullPolicy: IfNotPresent
  # Overridden by CI pipeline to the Git SHA tag.
  tag: "staging-latest"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: ssb-app.staging.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Enable TLS in real staging:
  # tls:
  #   - secretName: ssb-app-staging-tls
  #     hosts:
  #       - ssb-app.staging.local

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  LOG_LEVEL: "info"
  APP_ENV: "staging"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ssb-app
