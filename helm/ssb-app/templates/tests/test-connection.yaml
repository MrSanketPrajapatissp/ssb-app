apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ssb-app.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssb-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command:
        - sh
        - -c
        - |
          set -e
          echo "[test] Checking /health endpoint..."
          wget -qO- http://{{ include "ssb-app.fullname" . }}:{{ .Values.service.port }}/health
          echo ""
          echo "[test] Checking /ready endpoint..."
          wget -qO- http://{{ include "ssb-app.fullname" . }}:{{ .Values.service.port }}/ready
          echo ""
          echo "[test] Checking /metrics endpoint..."
          wget -qO- http://{{ include "ssb-app.fullname" . }}:{{ .Values.service.port }}/metrics | head -5
          echo ""
          echo "[test] All checks passed."
  volumes:
    - name: tmp
      emptyDir: {}
