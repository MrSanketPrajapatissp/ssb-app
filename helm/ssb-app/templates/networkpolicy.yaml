# NetworkPolicy — Default-deny ingress; allow only from ingress controller and Prometheus.
# This implements micro-segmentation: ssb-app pods only receive traffic
# from the nginx ingress controller namespace and from prometheus for scraping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ssb-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssb-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ssb-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from the nginx ingress controller (namespaceSelector).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP

    # Allow Prometheus to scrape /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP

  egress:
    # Allow DNS resolution (CoreDNS on port 53 UDP/TCP).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
