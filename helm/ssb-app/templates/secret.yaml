# secret.yaml — Secret template for ssb-app.
# IMPORTANT: This template creates a placeholder Secret with empty values.
# In production, use one of these approaches:
#   1. External Secrets Operator (ESO) syncing from AWS Secrets Manager.
#   2. Sealed Secrets (Bitnami) for GitOps-safe encrypted secrets.
#   3. AWS IRSA + SecretProviderClass (CSI Secret Store Driver).
# NEVER store actual secret values in this chart or in Git.
#
# For local demo, the secret is created with placeholder values.
# The application reads secrets from environment variables.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ssb-app.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssb-app.labels" . | nindent 4 }}
  annotations:
    # Indicates this secret is managed externally in production.
    ssb.io/secret-source: "placeholder-see-docs-for-production-secret-management"
type: Opaque
# PLACEHOLDER VALUES ONLY — Replace with External Secrets Operator in production.
stringData:
  # Example: API key for downstream service integration.
  API_KEY: "PLACEHOLDER_REPLACE_WITH_ESO_IN_PRODUCTION"
  # Example: Database connection string.
  DB_DSN: "PLACEHOLDER_REPLACE_WITH_ESO_IN_PRODUCTION"
